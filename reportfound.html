<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
            content="width=device-width", initial-scale=1.0">
        <title>
            TraceBack.Dashboard
        </title>
        <link rel="stylesheet" href="dashboard.css">
    </head>
<body>
<div class="form-card">
                    <h1>Report Found Item</h1>
                    <p> Help reunite someone with their belongings by providing accurate information.</p>

                    <form>
                        <!--image upload-->
                        <div class="input-group">
                            <label>Upload Item Image</label>
                            <div class="upload-box">
                                <input type="file" id="imageUpload" hidden>
                                <label for="imageUpload" class="upload-label">
                                <div class="upload-icon">📷</div>
                                    <h3>drag and drop image</h3>
                                    <p>or click to browse</p>
                                </label>
                                </div>
                                <img id="previewImage">
                             </div>
                            <!--item name-->
                            <div class="input-group">
                                <label>Item Name</label>
                                <input type="text" placeholder="eg:MacBook Air">
                            </div>
                            <!--category-->
                            <div class="input-group">
                                <label>Category</label>
                                <select>
                                    <option>select category</option>
                                    <option>Electronics</option>
                                    <option>Books</option>

                                    <option>Bag</option>

                                    <option>Keys</option>

                                    <option>ID Card</option>

                                    <option>Wallet</option>

                                    <option>Other</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Description</label>
                                <textarea placeholder="Describe your item..."></textarea>
                            </div>
                            <div class="input-group">
                                <label>Found Location</label>
                                <input type="text" placeholder="eg:Library">
                            </div>
                            <!--Date-->
                            <div class="input-group">
                                <label>Date Found</label>
                                <input type="date">
                            </div>
                           <!--time-->
                            <div class="input-group">
                                <label>Time Found</label>
                                <input type="time">
                            </div>
                            <!--current location-->
                            <div class="input-group">
                                <label>Current Storage Location</label>
                                <input type="text" placeholder="Eg: Security Office">
                            </div>
                            <!--extra-->
                            <div class="input-group">
                                <label>Additional Notes</label>
                                <textarea placeholder="Any extra information about where or how you found the item.">
                                </textarea>
                            </div>
                            <!--Contact-->
                            <div class="input-group">
                                <label>Contact number</label>
                                <input type="tel">
                            </div>
                            <button type="submit" class="submit-btn">
                                Submit report
                            </button>
                        </form>
                    </div>
</body>
</html>
