<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
            content="width=device-width", initial-scale=1.0">
    <title>TraceBack.Register</title>
    <link rel="stylesheet" href="register.css">
    <body>
     <form>
        <section class="register-head">
        <h3>Sign Up</h3>
        <label for="email">Email</label>
        <input type="email"
                id="email"
                placeholder="Enter your email">
        <label for="password">Password</label>
        <input type="password"
                id="password"
                placeholder="Enter your password">
        </section>
        <section class="register-tail">
            <div class="remember">
            <input type="checkbox">
            <label>Remember me</label>
        </div>
        
        <div class="register">
        <button type="submit">
            Register
        </button>
        </div>
        
        </section>
        

     </form>
    </body>
    </head>
</html>
