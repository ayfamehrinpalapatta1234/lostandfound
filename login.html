<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
            content="width=device-width", initial-scale=1.0">
    <title>TraceBack.Login</title>
    <link rel="stylesheet" href="login.css">
    <body>
     <form>
        <section class="login-head">
        <h3>Welcome Back !</h3>
        <label for="email">Email</label>
        <input type="email"
                id="email"
                placeholder="Enter your email">
        <label for="password">Password</label>
        <input type="password"
                id="password"
                placeholder="Enter your password">
        </section>
        <section class="login-tail">
            <div class="remember">
            <input type="checkbox">
            <label>Remember me</label>
        </div>
        <div class="forgot">
        <a href="#">Forgot password?</a>
    </div>
        </section>
        <div class="login">
        <button type="submit">
            Login
        </button>
        </div>
        <div class="signup">
            <h3>Don't have an account?</h3>
            <a href="regiter.html">Sign Up</a>
        </div>
        
        

     </form>
    </body>
    </head>
</html>
